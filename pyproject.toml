[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["signalglass"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
